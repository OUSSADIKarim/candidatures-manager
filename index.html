<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Gestion et suivi des candidatures">
    <title>Recrutement</title>
    <script>
      // Apply the saved theme before first paint to avoid a light flash (same key as ThemeToggle).
      try {
        const mode = localStorage.getItem('cm:theme')
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
        if (mode === 'dark' || ((!mode || mode === 'auto') && prefersDark)) {
          document.documentElement.classList.add('dark')
        }
      } catch {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
